services:
  auth_service:
    build:
      context: ./auth_service
    container_name: llm_auth_service
    env_file:
      - ./auth_service/.env
    ports:
      - "8000:8000"
    volumes:
      - auth_data:/app/data
    environment:
      SQLITE_PATH: /app/data/auth.db
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  bot_api:
    build:
      context: ./bot_service
    container_name: llm_bot_api
    env_file:
      - ./bot_service/.env
    ports:
      - "8001:8001"
    depends_on:
      - redis
      - rabbitmq
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001"]

  telegram_bot:
    build:
      context: ./bot_service
    container_name: llm_telegram_bot
    env_file:
      - ./bot_service/.env
    depends_on:
      - redis
      - rabbitmq
    command: ["uv", "run", "python", "-m", "app.bot.runner"]
    restart: unless-stopped

  celery_worker:
    build:
      context: ./bot_service
    container_name: llm_celery_worker
    env_file:
      - ./bot_service/.env
    depends_on:
      - redis
      - rabbitmq
    command: ["uv", "run", "celery", "-A", "app.infra.celery_app.celery_app", "worker", "--loglevel=INFO"]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: llm_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: llm_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  auth_data:
  redis_data:
  rabbitmq_data:
